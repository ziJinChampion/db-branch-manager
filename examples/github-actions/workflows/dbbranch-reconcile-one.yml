name: Reconcile one PR database
on:
  workflow_call:
    inputs:
      pr:
        required: true
        type: number
      closed_only:
        required: true
        type: boolean

defaults:
  run:
    shell: bash

permissions:
  contents: read
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    environment: dbbranch-preview
    env:
      PR: ${{ inputs.pr }}
      REPO_ID: ${{ github.repository_id }}
      GH_TOKEN: ${{ github.token }}
      CLOSED_ONLY: ${{ inputs.closed_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.DBBRANCH_REPOSITORY }}
          ref: ${{ vars.DBBRANCH_REF }}
          path: manager
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: manager/go.mod
          cache-dependency-path: manager/go.sum
      - name: Load current PR database generations
        working-directory: manager
        env:
          DBBRANCH_ADMIN_URL: ${{ secrets.DBBRANCH_ADMIN_URL }}
        run: |
          go build -o "$RUNNER_TEMP/dbbranch" ./cmd/dbbranch
          "$RUNNER_TEMP/dbbranch" status --repo-id "$REPO_ID" --env preview --pr "$PR" --json > "$RUNNER_TEMP/generations.json"
      - name: Determine which generations can be destroyed
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.state' > "$RUNNER_TEMP/pr-state"
          touch "$RUNNER_TEMP/remove-ids"
          if [[ "$(cat "$RUNNER_TEMP/pr-state")" == closed ]]; then
            ./ci/teardown-preview.sh "$PR"
            jq -r '.[].id' "$RUNNER_TEMP/generations.json" > "$RUNNER_TEMP/remove-ids"
          elif [[ "$CLOSED_ONLY" == false ]]; then
            while IFS= read -r id; do
              # The hook must return success only when no deployment uses this generation.
              if ./ci/preview-generation-unused.sh "$PR" "$id"; then
                echo "$id" >> "$RUNNER_TEMP/remove-ids"
              fi
            done < <(jq -r '.[].id' "$RUNNER_TEMP/generations.json")
          fi
      - name: Destroy detached databases
        env:
          DBBRANCH_ADMIN_URL: ${{ secrets.DBBRANCH_ADMIN_URL }}
        run: |
          scope=(--repo-id "$REPO_ID" --env preview --pr "$PR")
          while IFS= read -r id; do
            "$RUNNER_TEMP/dbbranch" destroy "${scope[@]}" --id "$id"
          done < "$RUNNER_TEMP/remove-ids"
